[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simipix"
version = "1.0.0"
description = "simipix — локальный визуальный поиск изображений на DINOv2-giant (1536-мерные эмбеддинги) + LanceDB. Поиск по картинке, лицу, позе, цветовой палитре и NSFW-контенту. Тяжелые веса локально, дедуп по sha1, защита от перемещения файлов. Веб-страница: каталог, текстовый фильтр и пагинация, client-side cosine-поиск похожих снимков, топ-5 палитры и позы."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
    "torchvision",
    "transformers>=4.44",
    "lancedb>=0.15",
    "pylance>=0.20",
    "pillow>=10.0",
    "tqdm>=4.66",
    "numpy>=1.24",
    "networkx>=3.0",
]

[project.scripts]
imgsim = "imgsim.cli:main"

[tool.setuptools.packages.find]
include = ["imgsim*"]
